<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Image Enhancer</title>
    <link rel="stylesheet" href="css/style.css">


    <!-- Include Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>AI Text Image Enhancer</h1>
            <p>Restore blurry images and text structures using the Real-ESRGAN model.</p>
        </header>

        <main class="main-card">
            <!-- Image Upload Section -->
            <div class="upload-section">
                <label for="imageInput" class="custom-file-upload">
                    <span>📁 Choose an Image</span>
                    <input type="file" id="imageInput" accept="image/*">
                </label>
            </div>

            <!-- Magnification Options Section -->
            <div class="options-section">
                <span class="options-title">Magnification:</span>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="outscale" value="2" checked> <span>2x</span></label>
                    <label class="radio-label"><input type="radio" name="outscale" value="4"> <span>4x</span></label>
                    <label class="radio-label"><input type="radio" name="outscale" value="6"> <span>6x</span></label>
                    <label class="radio-label"><input type="radio" name="outscale" value="8"> <span>8x</span></label>
                </div>
            </div>

            <!-- Execution Button -->
            <button class="primary-btn" onclick="processImage()" id="processBtn">Enhance Image</button>
            
            <!-- Progress Bar Section -->
            <div id="progressWrapper" class="progress-wrapper">
                <div class="progress-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <p id="progressText" class="progress-text">0%</p>
            </div>

            <!-- Image Preview Section -->
            <div class="preview-section">
                <div class="image-box">
                    <h3>Original Image</h3>
                    <div class="img-container">
                        <img id="originalImage" style="display:none;" alt="Original Image">
                        <span class="placeholder-text" id="origPlaceholder">No image selected</span>
                    </div>
                </div>
                
                <div class="image-box">
                    <h3>Result</h3>
                    <div class="img-container">
                        <img id="resultImage" style="display:none;" alt="Result Image">
                        <span class="placeholder-text" id="resPlaceholder">Waiting for processing...</span>
                    </div>
                </div>
            </div> <!-- End of preview-section -->

            <!-- Download Button -->
            <button id="downloadBtn" class="download-btn" onclick="downloadImage()" style="margin-top: 25px;">Download The Enhanced Image</button>

        </main>
    </div>

    
    <script src="js/app.js"></script>
</body>
</html>
